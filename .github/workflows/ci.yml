name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt-test:
    name: dbt Build, Test, and Data Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DBT_SERVER: ${{ secrets.DBT_SERVER }}
      DBT_DATABASE: ${{ secrets.DBT_DATABASE }}
      DBT_USER: ${{ secrets.DBT_USER }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      DBT_DRIVER: ODBC Driver 18 for SQL Server
      DBT_WINDOWS_LOGIN: "false"
      DBT_ENCRYPT: "true"
      DBT_TRUST_CERT: "false"
      WAREHOUSE_DB_CONNECTION_STRING: ${{ secrets.WAREHOUSE_DB_CONNECTION_STRING }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Microsoft ODBC driver
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dbt and validation dependencies
        run: python -m pip install dbt-sqlserver pyodbc

      - name: Verify database secrets
        shell: bash
        run: |
          test -n "$DBT_SERVER" || { echo "DBT_SERVER secret is required"; exit 1; }
          test -n "$DBT_DATABASE" || { echo "DBT_DATABASE secret is required"; exit 1; }
          test -n "$DBT_USER" || { echo "DBT_USER secret is required"; exit 1; }
          test -n "$DBT_PASSWORD" || { echo "DBT_PASSWORD secret is required"; exit 1; }
          test -n "$WAREHOUSE_DB_CONNECTION_STRING" || { echo "WAREHOUSE_DB_CONNECTION_STRING secret is required"; exit 1; }

      - name: Install dbt packages
        working-directory: dbt_warehouse
        run: dbt deps

      - name: Build dbt project
        working-directory: dbt_warehouse
        run: dbt build --target dev --profiles-dir .

      - name: Run dbt tests
        working-directory: dbt_warehouse
        run: dbt test --target dev --profiles-dir .

      - name: Run raw-data validation
        run: python scripts/validate_data.py --report artifacts/data_validation_report.json

      - name: Upload dbt and validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-validation-artifacts
          if-no-files-found: warn
          path: |
            dbt_warehouse/logs/
            dbt_warehouse/target/
            artifacts/data_validation_report.json

  backend-test:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt flake8
      - name: Lint Python
        run: flake8 backend/app --max-line-length=120 --extend-ignore=E501,W391
      - name: Run Python tests
        run: pytest backend/tests scripts/tests

  sql-lint:
    name: SQLFluff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLFluff
        run: python -m pip install sqlfluff
      - name: Lint SQL files
        # LT12 establishes an enforceable baseline for the existing SQL corpus;
        # SQLFluff still parses every file with the T-SQL dialect.
        run: sqlfluff lint database --dialect tsql --rules LT12
