name: 'warehouse_analytics'
version: '1.0.0'
config-version: 2

profile: 'warehouse_analytics'

# ---------------------------------------------------------------------------
# Path configuration
# ---------------------------------------------------------------------------
model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]
target-path:    "target"
clean-targets:  ["target", "dbt_packages"]

# ---------------------------------------------------------------------------
# Model configuration
# ---------------------------------------------------------------------------
models:
  warehouse_analytics:

    # Staging: light-weight views that rename / cast source columns
    staging:
      +materialized: view
      +schema: staging

    # Intermediate: ephemeral CTEs — no physical objects created in the DB
    intermediate:
      +materialized: ephemeral

    # Marts: persistent tables consumed by Power BI & FastAPI
    marts:
      +materialized: table
      +schema: mart

# ---------------------------------------------------------------------------
# Seed configuration
# ---------------------------------------------------------------------------
seeds:
  warehouse_analytics:
    +schema: raw

# ---------------------------------------------------------------------------
# Snapshot configuration
# ---------------------------------------------------------------------------
snapshots:
  warehouse_analytics:
    +target_schema: snapshots

# ---------------------------------------------------------------------------
# Project-level variables
# ---------------------------------------------------------------------------
vars:
  # Date range used by date-spine and KPI calculations
  start_date: '2025-01-01'
  end_date:   '2026-12-31'

  # Source schema names (override per environment if needed)
  raw_schema:     raw
  staging_schema: staging
  mart_schema:    mart
