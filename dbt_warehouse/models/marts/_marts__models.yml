version: 2

models:

  # ── dim_date ──────────────────────────────────────────────────────────────
  - name: dim_date
    description: >
      Date dimension spanning 2024-01-01 to 2027-12-31. Includes standard
      calendar attributes (year, quarter, month, week, day) plus a fiscal
      calendar with July 1 as the fiscal year start.
    columns:
      - name: date_key
        description: "Primary key — the calendar date"
        tests: [unique, not_null]
      - name: year
        tests: [not_null]
      - name: month_number
        description: "Calendar month (1–12)"
        tests: [not_null]
      - name: quarter_number
        description: "Calendar quarter (1–4)"
        tests: [not_null]
      - name: is_weekend
        description: "1 if Saturday or Sunday, else 0"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fiscal_year
        description: "Fiscal year (starts July 1 — e.g. July 2025 → FY2026)"
        tests: [not_null]
      - name: fiscal_month
        description: "Fiscal month (1–12, starting July = 1)"
        tests: [not_null]
      - name: fiscal_quarter
        description: "Fiscal quarter (Q1 = Jul-Sep, Q2 = Oct-Dec, Q3 = Jan-Mar, Q4 = Apr-Jun)"
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]

  # ── dim_warehouse ──────────────────────────────────────────────────────────
  - name: dim_warehouse
    description: >
      Warehouse dimension with location attributes, capacity, and a derived
      size_category classification. Materialized as a table in the mart schema.
    columns:
      - name: warehouse_key
        description: "Surrogate key generated from warehouse_id"
        tests: [unique, not_null]
      - name: warehouse_id
        description: "Natural key from source system"
        tests: [unique, not_null]
      - name: warehouse_code
        description: "Short business identifier for the warehouse"
        tests: [unique, not_null]
      - name: warehouse_name
        tests: [not_null]
      - name: warehouse_type
        description: "Operational classification of the warehouse"
        tests:
          - accepted_values:
              arguments:
                values: ['Distribution Center', 'Fulfillment Center', 'Cold Storage',
                         'Regional Hub', 'Distribution', 'Fulfillment']
      - name: is_active
        tests: [not_null]
      - name: size_category
        description: "Derived: Large (≥200k sqft) / Medium (≥100k) / Small"
        tests:
          - accepted_values:
              arguments:
                values: ['Large', 'Medium', 'Small']

  # ── dim_product ────────────────────────────────────────────────────────────
  - name: dim_product
    description: >
      Product dimension with pricing, physical attributes, and derived
      price_tier and weight_class classifications.
    columns:
      - name: product_key
        description: "Surrogate key generated from product_id"
        tests: [unique, not_null]
      - name: product_id
        description: "Natural key from source system"
        tests: [unique, not_null]
      - name: sku
        description: "Stock Keeping Unit — unique product business key"
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]
      - name: unit_cost
        tests: [not_null]
      - name: unit_price
        tests: [not_null]
      - name: price_tier
        description: "Derived: Premium (≥$200) / Standard (≥$50) / Economy"
        tests:
          - accepted_values:
              arguments:
                values: ['Premium', 'Standard', 'Economy']
      - name: weight_class
        description: "Derived: Heavy (≥50 lbs) / Medium (≥10 lbs) / Light"
        tests:
          - accepted_values:
              arguments:
                values: ['Heavy', 'Medium', 'Light']

  # ── dim_employee ───────────────────────────────────────────────────────────
  - name: dim_employee
    description: >
      Employee dimension with department, shift, and derived tenure metrics.
      tenure_days and tenure_band are calculated at query time using GETDATE().
    columns:
      - name: employee_key
        description: "Surrogate key generated from employee_id"
        tests: [unique, not_null]
      - name: employee_id
        description: "Natural key from source system"
        tests: [unique, not_null]
      - name: employee_code
        description: "Business key — unique employee identifier"
        tests: [unique, not_null]
      - name: full_name
        tests: [not_null]
      - name: department
        tests:
          - accepted_values:
              arguments:
                values: ['Receiving', 'Picking', 'Packing', 'Shipping',
                         'Inventory Control', 'Management']
      - name: shift
        tests:
          - accepted_values:
              arguments:
                values: ['Day', 'Swing', 'Night']
      - name: is_active
        tests: [not_null]
      - name: tenure_days
        description: "Derived: days between hire_date and GETDATE()"
      - name: tenure_band
        description: "Derived: Senior / Experienced / Intermediate / Junior based on years at company"
        tests:
          - accepted_values:
              arguments:
                values: ['Senior (5+ yrs)', 'Experienced (2-5 yrs)',
                         'Intermediate (1-2 yrs)', 'Junior (< 1 yr)']

  # ── fact_inventory ─────────────────────────────────────────────────────────
  - name: fact_inventory
    description: >
      Daily inventory snapshot fact table. One row per warehouse + product +
      snapshot_date. Joined to dim_warehouse and dim_product via surrogate keys.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - row_count_anomaly:
          arguments:
            date_column: date_key
            lookback_days: 14
            max_deviation_pct: 0.50
            min_baseline_days: 3
          config:
            severity: warn
    columns:
      - name: inventory_fact_key
        description: "Surrogate key: MD5 of snapshot_date || warehouse_id || product_id"
        tests: [unique, not_null]
      - name: warehouse_key
        description: "FK to dim_warehouse"
        tests: [not_null]
      - name: product_key
        description: "FK to dim_product"
        tests: [not_null]
      - name: date_key
        description: "FK to dim_date (snapshot_date)"
        tests: [not_null]
      - name: quantity_on_hand
        description: "Total units physically present in the warehouse"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.95
                min_value: 0
                max_value: 1000000
      - name: inventory_value_at_cost
        description: "Inventory value at cost basis"
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.95
                min_value: 0
                max_value: 1000000000
      - name: quantity_available
        description: "Units available for picking (on_hand minus reserved)"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: stock_status
        description: "Derived status: Out of Stock / Fully Reserved / Low Stock / In Stock"
        tests:
          - accepted_values:
              arguments:
                values: ['Out of Stock', 'Fully Reserved', 'Low Stock', 'In Stock']
      - name: needs_reorder
        description: "1 if quantity_available ≤ reorder_point, else 0"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: expiring_within_30_days
        description: "1 if expiry_date is within 30 days of snapshot_date, else 0"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  # ── fact_shipment ──────────────────────────────────────────────────────────
  - name: fact_shipment
    description: >
      Shipment fact table. One row per shipment. Includes delivery performance,
      transit-time measures, and line-item aggregates from stg_shipment_items.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - row_count_anomaly:
          arguments:
            date_column: date_key
            lookback_days: 14
            max_deviation_pct: 0.50
            min_baseline_days: 3
          config:
            severity: warn
    columns:
      - name: shipment_fact_key
        description: "Surrogate key: MD5 of shipment_id"
        tests: [unique, not_null]
      - name: warehouse_key
        description: "FK to dim_warehouse"
        tests:
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_key
      - name: date_key
        description: "FK to dim_date (ship_date)"
        tests: [not_null]
      - name: shipment_type
        tests:
          - accepted_values:
              arguments:
                values: ['Inbound', 'Outbound']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Pending', 'In Transit', 'Delivered', 'Cancelled', 'Returned']
      - name: delivery_performance
        tests:
          - accepted_values:
              arguments:
                values: ['On Time', 'Late', 'Cancelled', 'In Progress']
      - name: is_late
        description: "1 if actual_transit_days > expected_transit_days, else 0"
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: shipping_cost
        description: "Total shipping cost for this shipment"
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.95
                min_value: 0
                max_value: 1000000
      - name: actual_transit_days
        description: "Actual elapsed transit time for delivered shipments"
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.95
                min_value: 0
                max_value: 365
                row_condition: "actual_transit_days is not null"

  # ── fact_labor ─────────────────────────────────────────────────────────────
  - name: fact_labor
    description: >
      Labor productivity fact table. One row per employee + activity_type +
      activity_date. Joined to dim_warehouse and dim_employee via surrogate keys.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - row_count_anomaly:
          arguments:
            date_column: date_key
            lookback_days: 14
            max_deviation_pct: 0.50
            min_baseline_days: 3
          config:
            severity: warn
    columns:
      - name: labor_fact_key
        description: "Surrogate key: MD5 of activity_date || employee_id || activity_type"
        tests: [unique, not_null]
      - name: warehouse_key
        description: "FK to dim_warehouse"
        tests: [not_null]
      - name: employee_key
        description: "FK to dim_employee"
        tests: [not_null]
      - name: date_key
        description: "FK to dim_date (activity_date)"
        tests: [not_null]
      - name: activity_type
        tests:
          - accepted_values:
              arguments:
                values: ['Picking', 'Packing', 'Receiving', 'Putaway', 'Loading', 'Cycle Count']
      - name: total_hours
        description: "Total hours worked in this grouping"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 24
      - name: avg_units_per_hour
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.95
                min_value: 0
                max_value: 10000
        description: "Productivity: total_units / total_hours"
      - name: error_rate_pct
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.95
                min_value: 0
                max_value: 100
        description: "Quality: (total_errors / total_units) × 100"
      - name: labor_cost
        description: "Cost: total_hours × hourly_rate"
      - name: productivity_tier
        description: "Derived: High (≥100 UPH) / Medium (≥50) / Low"
        tests:
          - accepted_values:
              arguments:
                values: ['High', 'Medium', 'Low']

  # Monthly aggregate tables used by the Power BI automatic aggregation layer.
  - name: agg_inventory_monthly
    description: "Monthly inventory aggregate at warehouse and product grain."
    columns:
      - name: month_start
        tests: [not_null]
      - name: warehouse_key
        tests: [not_null]
      - name: product_key
        tests: [not_null]

  - name: agg_shipment_monthly
    description: "Monthly shipment aggregate at warehouse, shipment type, and carrier grain."
    columns:
      - name: month_start
        tests: [not_null]
      - name: warehouse_key
        tests: [not_null]
      - name: shipment_type
        tests: [not_null]

  - name: agg_labor_monthly
    description: "Monthly labor aggregate at warehouse, employee, and activity grain."
    columns:
      - name: month_start
        tests: [not_null]
      - name: warehouse_key
        tests: [not_null]
      - name: employee_key
        tests: [not_null]
