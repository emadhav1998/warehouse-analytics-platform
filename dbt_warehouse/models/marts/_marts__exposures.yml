version: 2

exposures:
  - name: warehouse_power_bi_dashboard
    label: "Warehouse Operations Power BI Dashboard"
    type: dashboard
    maturity: high
    description: >
      Main Power BI dashboard for warehouse operations analytics. Add the
      published report URL here when the report is deployed to its workspace.
    depends_on:
      - ref('fact_inventory')
      - ref('fact_shipment')
      - ref('fact_labor')
      - ref('dim_warehouse')
      - ref('dim_product')
      - ref('dim_employee')
      - ref('dim_date')
    owner:
      name: "Data Analytics Team"
      email: "analytics@company.com"

  - name: kpi_api
    label: "Warehouse KPI API"
    type: application
    maturity: medium
    url: "http://localhost:8000/docs"
    description: "FastAPI backend serving KPI data to the governance portal."
    depends_on:
      - ref('fact_inventory')
      - ref('fact_shipment')
      - ref('fact_labor')
      - ref('dim_warehouse')
      - ref('dim_product')
    owner:
      name: "Data Engineering Team"
      email: "data-eng@company.com"
