version: 2

models:

  - name: stg_warehouses
    description: "Cleaned and standardised warehouse dimension source"
    columns:
      - name: warehouse_id
        description: "Surrogate primary key from raw.warehouses"
        tests: [unique, not_null]
      - name: warehouse_code
        description: "Business key — short identifier for the warehouse"
        tests: [unique, not_null]
      - name: warehouse_name
        tests: [not_null]
      - name: warehouse_type
        description: "Operational classification of the warehouse"
        tests:
          - accepted_values:
              arguments:
                values: ['Distribution Center', 'Fulfillment Center', 'Cold Storage',
                         'Regional Hub', 'Distribution', 'Fulfillment']
      - name: is_active
        tests: [not_null]

  - name: stg_products
    description: "Cleaned product catalog with derived margin columns"
    columns:
      - name: product_id
        description: "Surrogate primary key from raw.products"
        tests: [unique, not_null]
      - name: sku
        description: "Stock Keeping Unit — business-facing product identifier"
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]
      - name: unit_cost
        description: "Cost price per unit"
        tests: [not_null]
      - name: unit_price
        description: "Selling price per unit"
        tests: [not_null]
      - name: unit_margin
        description: "Derived: unit_price minus unit_cost"
      - name: margin_pct
        description: "Derived: gross margin percentage rounded to 2 decimal places"

  - name: stg_employees
    description: "Cleaned employee records with derived full_name column"
    columns:
      - name: employee_id
        description: "Surrogate primary key from raw.employees"
        tests: [unique, not_null]
      - name: employee_code
        description: "Business key — unique employee identifier"
        tests: [unique, not_null]
      - name: full_name
        description: "Derived: first_name + ' ' + last_name"
        tests: [not_null]
      - name: department
        tests:
          - accepted_values:
              arguments:
                values: ['Receiving', 'Picking', 'Packing', 'Shipping',
                         'Inventory Control', 'Management']
      - name: shift
        tests:
          - accepted_values:
              arguments:
                values: ['Day', 'Swing', 'Night']

  - name: stg_inventory
    description: "Daily inventory snapshots with derived stock_status classification"
    columns:
      - name: inventory_id
        description: "Surrogate primary key from raw.inventory"
        tests: [unique, not_null]
      - name: warehouse_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: quantity_on_hand
        tests: [not_null]
      - name: stock_status
        description: "Derived: Out of Stock / Fully Reserved / Low Stock / In Stock"
        tests:
          - accepted_values:
              arguments:
                values: ['Out of Stock', 'Fully Reserved', 'Low Stock', 'In Stock']

  - name: stg_shipments
    description: "Shipment records with derived transit-time and delivery-performance columns"
    columns:
      - name: shipment_id
        description: "Surrogate primary key from raw.shipments"
        tests: [unique, not_null]
      - name: shipment_number
        description: "Business key — unique shipment reference number"
        tests: [unique, not_null]
      - name: shipment_type
        tests:
          - accepted_values:
              arguments:
                values: ['Inbound', 'Outbound']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['Pending', 'In Transit', 'Delivered', 'Cancelled', 'Returned']
      - name: delivery_performance
        description: "Derived: On Time / Late / Cancelled / In Progress"
        tests:
          - accepted_values:
              arguments:
                values: ['On Time', 'Late', 'Cancelled', 'In Progress']

  - name: stg_shipment_items
    description: "Shipment line-item details — one row per product per shipment"
    columns:
      - name: shipment_item_id
        description: "Surrogate primary key from raw.shipment_items"
        tests: [unique, not_null]
      - name: shipment_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: quantity
        tests: [not_null]

  - name: stg_labor_activities
    description: "Labor activity records with derived duration and units_per_hour metrics"
    columns:
      - name: activity_id
        description: "Surrogate primary key from raw.labor_activities"
        tests: [unique, not_null]
      - name: employee_id
        tests: [not_null]
      - name: warehouse_id
        tests: [not_null]
      - name: activity_type
        tests:
          - accepted_values:
              arguments:
                values: ['Picking', 'Packing', 'Receiving', 'Putaway', 'Loading', 'Cycle Count']
      - name: activity_date
        tests: [not_null]
      - name: duration_minutes
        description: "Derived: end_time minus start_time in minutes"
      - name: duration_hours
        description: "Derived: duration_minutes divided by 60.0"
      - name: units_per_hour
        description: "Derived: units_processed per hour of activity duration"
